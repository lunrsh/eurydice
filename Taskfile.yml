version: 3

vars:
  GOOS:
    sh: FALLBACK_OS={{OS}} FALLBACK_ARCH={{ARCH}} ./ci/helpers/goos_det.sh {{.CLI_ARGS}}

  GOARCH:
    sh: FALLBACK_OS={{OS}} FALLBACK_ARCH={{ARCH}} ./ci/helpers/goarch_det.sh {{.CLI_ARGS}}

  OUTPUT_FILE: './dist/{{if eq .GOOS "windows"}}eurydice.exe{{else}}eurydice{{end}}'

  FFMPEG_DIST: '{{.ROOT_DIR}}/dist/ffmpeg_dist/{{.GOOS}}_{{.GOARCH}}'

  # Fuck you Apple
  PLATFORM_LD_ARGS:
    sh: |
      if [ "{{.GOOS}}" = "darwin" ]; then
        SDK_PATH="$(nix eval --raw 'nixpkgs#apple-sdk_14' 2>/dev/null || echo "")"

        if [ "$SDK_PATH" = "" ]; then
          echo "-L{{.FFMPEG_DIST}}/lib -Wl,-dead_strip_dylibs"
          exit 0
        fi

        echo "-F$SDK_PATH/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks -L$SDK_PATH/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/lib -L{{.FFMPEG_DIST}}/lib -Wl,-dead_strip_dylibs"
      elif [ "{{.GOOS}}" = "windows" ]; then
        echo "-static -L{{.FFMPEG_DIST}}/lib -mwindows -lavdevice -lavfilter -lavformat -lavcodec -lswresample -lswscale -lavutil -lmp3lame -lws2_32 -lole32 -loleaut32 -lshlwapi -lstrmiids -luuid -lbcrypt -lsecur32 -lncrypt -lcrypt32"
      else
        echo "-static -L{{.FFMPEG_DIST}}/lib"
      fi

  PLATFORM_CC_ARGS:
    sh: |
      if [ "{{.GOOS}}" = "darwin" ]; then
        echo ""
      else
        COMP_TARGET="$(FALLBACK_OS={{OS}} FALLBACK_ARCH={{ARCH}} ./ci/helpers/target_det.sh {{.CLI_ARGS}})"
        echo "-target $COMP_TARGET"
      fi

tasks:
  build-ffmpeg:
    - FALLBACK_OS={{OS}} FALLBACK_ARCH={{ARCH}} ./ci/build_ffmpeg.sh {{.CLI_ARGS}}

  build:
    - mkdir dist 2>/dev/null || exit 0
    - |
      if [ ! -d "{{.FFMPEG_DIST}}/lib/pkgconfig" ]; then
        FALLBACK_OS={{OS}} FALLBACK_ARCH={{ARCH}} ./ci/build_ffmpeg.sh {{.CLI_ARGS}}
      fi
    - cp assets/appbannerassets/output.png uicomponents/popups/initialize/output.png
    - cp assets/appbannerassets/source.txt uicomponents/popups/initialize/source.txt
    - 'PKG_CONFIG_PATH="{{.FFMPEG_DIST}}/lib/pkgconfig:${PKG_CONFIG_PATH:-}" PKG_CONFIG_PATH_FOR_TARGET="{{.FFMPEG_DIST}}/lib/pkgconfig:${PKG_CONFIG_PATH_FOR_TARGET:-}" CC="zig cc {{.PLATFORM_CC_ARGS}}" CXX="zig c++ {{.PLATFORM_CC_ARGS}}" GOOS="{{.GOOS}}" GOARCH="{{.GOARCH}}" CGO_LDFLAGS="{{.PLATFORM_LD_ARGS}} {{if ne .GOOS "darwin"}}$NIX_LDFLAGS{{end}}" go build -v -tags netgo -ldflags "-linkmode external -X git.lunr.sh/luna/eurydice/state.Version=$(git describe --tags --always --dirty) {{if eq .GOOS "windows"}}-H=windowsgui{{end}} -s -w" -o {{.OUTPUT_FILE}} .'

  dev:
    - task: build
    - EURYDICE_LOG_LEVEL=debug EURYDICE_NO_CRASH_DIALOG=1 EURYDICE_SHOW_DEBUG_UI=1 {{.OUTPUT_FILE}}

  package-macos:
    # if this fails: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
    # and if it fails after THAT: xcodebuild -runFirstLaunch
    - rm -rf dist/Eurydice.app
    - mkdir -p dist/Eurydice.app/Contents dist/Eurydice.app/Contents/Resources dist/Eurydice.app/Contents/MacOS 2>/dev/null || exit 0
    - |
      xcrun actool ./assets/eurydice-icon-macos.icon \
      --compile ./dist/Eurydice.app/Contents/Resources \
      --app-icon eurydice-icon-macos \
      --platform macosx \
      --minimum-deployment-target 14.0 \
      --output-partial-info-plist ./dist/EurydicePartial.plist \
      --enable-on-demand-resources NO
    - cp dist/eurydice dist/Eurydice.app/Contents/MacOS/eurydice
    - cp assets/mach.plist dist/Eurydice.app/Contents/info.plist
    - xattr -cr dist/Eurydice.app
    - codesign -fs "Luna Solaris" --deep dist/Eurydice.app
